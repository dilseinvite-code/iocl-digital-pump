name: Release Two-field Global Tank Registration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-quick-tank-registration.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iocl-worker-production-releases
  cancel-in-progress: false

jobs:
  deploy:
    name: Verify, additive D1 migration and deploy Worker
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Validate quick registration and entire frontend
        run: |
          node --check scripts/release/activate-quick-tank-registration.mjs
          bun run typecheck
          bun test tests/quickTankRegistration.test.ts tests/globalTankTypes15Percent.test.ts
          bun run build
      - name: Deploy Worker with additive schema and D1 recovery safeguard
        run: bun scripts/release/activate-quick-tank-registration.mjs
