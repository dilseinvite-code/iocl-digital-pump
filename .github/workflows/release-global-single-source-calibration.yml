name: Release Global Calibration Single-Source Tank Workflow
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-global-single-source-calibration.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iocl-worker-production-releases
  cancel-in-progress: false

jobs:
  deploy:
    name: Review full charts and guarded Cloudflare Worker release
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Validate single-source global chart reuse
        run: |
          node --check scripts/release/activate-readonly-excel-pdf.mjs
          bun run typecheck
          bun test tests/quickTankRegistration.test.ts tests/pumpInfrastructureFrontendPhase3.test.ts
          bun run build
      - name: Guarded read-only D1 check and one Worker deploy
        run: bun scripts/release/activate-readonly-excel-pdf.mjs
