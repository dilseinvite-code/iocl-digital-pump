name: Release Tank Calibration Status and Activation UX
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-tank-activation-ux.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iocl-worker-production-releases
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate and release Worker without data migrations
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Validate lifecycle badges, activation policy and build
        run: |
          node --check scripts/release/activate-readonly-excel-pdf.mjs
          bun run typecheck
          bun test tests/pumpInfrastructureFrontendPhase3.test.ts tests/quickTankRegistration.test.ts
          bun run build
      - name: Guarded Worker release with read-only D1 preflight
        run: bun scripts/release/activate-readonly-excel-pdf.mjs
