name: Release deferred shift finance
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-deferred-shift-finance.yml'
permissions:
  contents: read
concurrency:
  group: iocl-cloudflare-worker-production
  cancel-in-progress: false
jobs:
  deploy:
    name: Verify additive 0042 and deploy Worker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Require exact evaluated feature revision
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "91659999646cc13253f8a37b7758acc872431c60"
          test "$(git diff-tree --no-commit-id --name-only -r HEAD)" = ".github/workflows/release-deferred-shift-finance.yml"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
      - uses: oven-sh/setup-bun@v2
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Verify build and two-stage shift regression
        run: |
          bun run typecheck
          bun test tests/dailyFuelOperations.test.ts tests/financeWorkflow.test.ts tests/connectedShiftWorkbench.test.ts
          bun run build
      - name: Guarded production migration and Worker deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_SEND_METRICS: 'false'
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          node --input-type=module <<'RELEASE_SCRIPT'
          import fs from 'node:fs';
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          
          const NAME = 'iocl-digital-pump-manager';
          const DB = 'iocl-pump-manager-d1';
          const UUID = '305f76c6-c940-443f-86a9-33c309a55578';
          const ACCOUNT = '93888554ef9d9e0b8c18b322683a9652';
          const MIGRATION = 'migrations/additive/0042_deferred_shift_finance.sql';
          const HASH = '8c5fb2d17a44dfb5375f806798267d0cd8647a97a50b477d285b815b29152dfe';
          const token = process.env.CLOUDFLARE_API_TOKEN || '';
          const account = process.env.CLOUDFLARE_ACCOUNT_ID || '';
          function guard(ok, msg) { if (!ok) throw Error(msg); }
          function run(args) {
            try {
              return execFileSync('./node_modules/.bin/wrangler', args, {
                encoding: 'utf8', maxBuffer: 20 * 1024 * 1024, stdio: ['ignore','pipe','pipe'],
              });
            } catch { throw Error('Wrangler command failed: ' + args.slice(0, 2).join(' ')); }
          }
          function query(sql) {
            const json = JSON.parse(run(['d1','execute',DB,'--remote','--config','wrangler.jsonc','--command',sql,'--json','--yes']));
            guard(Array.isArray(json) && json.length === 1 && json[0].success !== false && Array.isArray(json[0].results), 'D1 read check failed');
            return json[0].results;
          }
          async function cf(route) {
            const response = await fetch('https://api.cloudflare.com/client/v4/accounts/' + account + '/d1/database/' + UUID + route, {
              headers:{Authorization:'Bearer ' + token, Accept:'application/json'}, signal:AbortSignal.timeout(35000)
            });
            guard(response.ok, 'Cloudflare metadata HTTP ' + response.status);
            const json = await response.json();
            guard(json.success === true, 'Cloudflare identity or recovery metadata unavailable');
            return json.result;
          }
          const protectedTables = [
            'users','retail_outlets','operational_shifts','operational_shift_nozzles','nozzle_meter_readings',
            'operational_shift_tanks','tank_stock_readings','fuel_receipts','fuel_receipt_tank_lines',
            'shift_stock_reconciliations','operational_shift_product_prices','shift_collections',
            'cash_handover_logs','bank_deposits','shift_financial_reconciliations','cng_shift_logs',
            'lube_shift_sales','audit_logs','tanks','tank_calibration_charts','tank_calibration_points',
            'global_tank_calibration_templates','global_tank_calibration_template_points'
          ];
          function counts() {
            const rows = query(protectedTables.map(name => "SELECT '" + name + "' AS name, COUNT(*) AS n FROM \"" + name + "\"").join(' UNION ALL '));
            guard(rows.length === protectedTables.length && rows.every(r => Number.isSafeInteger(r.n)), 'Could not capture all protected-table counts');
            return Object.fromEntries(rows.map(r=>[r.name,r.n]));
          }
          const norm = sql => sql.replace(/--[^\n]*/g,'').replace(/\bIF\s+NOT\s+EXISTS\s+/gi,'').replace(/\s+/g,' ').replace(/;\s*$/,'').trim().toLowerCase();
          function schema() {
            return query("SELECT name, sql FROM sqlite_master WHERE name IN ('deferred_shift_finance','idx_deferred_shift_finance_outlet_status') ORDER BY name");
          }
          function validateSchema(sql) {
            const expected = sql.replace(/--[^\n]*/g,'').split(';').map(norm).filter(Boolean);
            const actual = schema();
            guard(actual.length === 2 && actual.every(r => typeof r.sql === 'string' && expected.includes(norm(r.sql))), 'New table/index schema differs from rehearsed migration');
            guard(query('PRAGMA foreign_key_check(deferred_shift_finance)').length === 0, 'New table has foreign key violations');
          }
          try {
            console.log('[1/5] Verify exact production Worker, D1 identity and recovery bookmark.');
            guard(token.length >= 12 && account === ACCOUNT, 'Wrong account or unavailable release credentials');
            const config = JSON.parse(fs.readFileSync('wrangler.jsonc','utf8'));
            guard(config.name === NAME && config.vars?.ENVIRONMENT === 'production' &&
                  config.d1_databases?.length === 1 && config.d1_databases[0].binding === 'DB' &&
                  config.d1_databases[0].database_name === DB && config.d1_databases[0].database_id === UUID, 'Unexpected Worker or D1 target');
            const db = await cf('');
            guard(db.uuid === UUID && db.name === DB && db.version === 'production', 'D1 identity mismatch');
            const bookmark = await cf('/time_travel/bookmark');
            guard(typeof bookmark?.bookmark === 'string' && bookmark.bookmark.length >= 20, 'D1 recovery bookmark unavailable');
            const sql = fs.readFileSync(MIGRATION,'utf8');
            guard(createHash('sha256').update(sql).digest('hex') === HASH, 'Migration differs from tested 0042');
            console.log('[2/5] Read protected legacy counts and determine whether new schema is installed.');
            const before = counts();
            const existing = schema();
            console.log('[3/5] Apply only allowlisted additive 0042 if missing.');
            if (existing.length === 0) {
              run(['d1','execute',DB,'--remote','--config','wrangler.jsonc','--file',MIGRATION,'--yes']);
              validateSchema(sql);
              guard(query('SELECT COUNT(*) AS n FROM deferred_shift_finance')[0]?.n === 0, 'New table unexpectedly contains records');
            } else {
              validateSchema(sql);
              console.log('Exact schema already installed; no migration write required.');
            }
            console.log('[4/5] Validate schema and compare protected table counts before deploying.');
            const after = counts();
            guard(protectedTables.every(t=>before[t] === after[t]), 'Protected counts changed during migration; do not deploy until investigated');
            console.log('Protected counts unchanged; new schema verified; recovery bookmark obtained.');
            console.log('[5/5] Deploy the tested Worker; no seeds, baseline migrations, or shift modifications.');
            const result = run(['deploy','--config','wrangler.jsonc']);
            guard(/(?:Deployed|Uploaded).*iocl-digital-pump-manager/i.test(result), 'Worker deploy did not return expected deployment confirmation');
            console.log('SUCCESS: Additive 0042 verified, production Worker deployed, no existing legacy rows modified by migration.');
          } catch (e) {
            console.error('RELEASE STOPPED: ' + (e instanceof Error ? e.message : 'unknown failure'));
            process.exitCode = 1;
          }
          RELEASE_SCRIPT
      - name: Summarize verified release
        if: success()
        run: echo 'Verified 0042 additive schema, protected counts unchanged, D1 recovery bookmark available, production Worker deployed.' >> "$GITHUB_STEP_SUMMARY"
