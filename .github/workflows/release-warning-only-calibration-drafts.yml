name: Release Warning-Only Global Calibration Drafts
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-warning-only-calibration-drafts.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iocl-worker-production-releases
  cancel-in-progress: false

jobs:
  deploy:
    name: Verify and deploy Worker with read-only D1 preflight
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Validate warning-only draft behavior
        run: |
          node --check scripts/release/activate-readonly-excel-pdf.mjs
          bun run typecheck
          bun test tests/quickTankRegistration.test.ts tests/excelCalibrationImport.test.ts tests/globalTankCalibrationTemplates.test.ts
          bun run build
      - name: Deploy Worker without D1 migrations
        run: bun scripts/release/activate-readonly-excel-pdf.mjs
