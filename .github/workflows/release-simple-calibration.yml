name: Release Simplified Calibration Upload

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-simple-calibration.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iocl-worker-production-releases
  cancel-in-progress: false

jobs:
  deploy:
    name: Verify and deploy simple calibration upload (no migrations)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Validate types, calibration tests and frontend build
        run: |
          node --check scripts/release/activate-readonly-excel-pdf.mjs
          bun run typecheck
          bun test tests/simpleCalibrationUploader.test.ts tests/globalTankCalibrationTemplates.test.ts tests/excelCalibrationImport.test.ts tests/tenKlCalibrationLimit.test.ts
          bun run build
      - name: Deploy Cloudflare Worker with production D1 safeguards
        run: bun scripts/release/activate-readonly-excel-pdf.mjs
# Production release trigger (2026-11-23): PR #102 global tank types 10/15/20/50 KL and +15% calibration chart ceiling.
