name: Release 10KL 11000L Calibration Cutoff

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-10kl-calibration-cap.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iocl-worker-production-releases
  cancel-in-progress: false

jobs:
  deploy:
    name: Verify and deploy calibrated 11KL limit (no migrations)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Validate TypeScript, cap tests, build and safe deploy script
        run: |
          node --check scripts/release/activate-readonly-excel-pdf.mjs
          bun run typecheck
          bun test tests/tenKlCalibrationLimit.test.ts tests/suppliedTenKlCalibrationChart.test.ts tests/globalTankCalibrationTemplates.test.ts
          bun run build
      - name: Deploy Cloudflare Worker with D1 recovery safeguards
        run: bun scripts/release/activate-readonly-excel-pdf.mjs
